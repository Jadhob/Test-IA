<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IA Locale Gratuite</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#ffffff; --text:#1a1a1a; --muted:#6b6b76;
    --accent:#5b47e0; --accent-text:#ffffff; --border:#e2e2e7; --bubble-user:#5b47e0;
    --bubble-bot:#eef0f4;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121214; --panel:#1c1c1f; --text:#f0f0f2; --muted:#9a9aa2;
      --accent:#8a7bff; --accent-text:#111; --border:#2c2c31; --bubble-user:#8a7bff;
      --bubble-bot:#28282d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121214; --panel:#1c1c1f; --text:#f0f0f2; --muted:#9a9aa2;
    --accent:#8a7bff; --accent-text:#111; --border:#2c2c31; --bubble-user:#8a7bff;
    --bubble-bot:#28282d;
  }
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100%;
  }
  header{
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  header h1{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;}
  select,button{
    font:inherit; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); padding:8px 10px; cursor:pointer;
  }
  #status{font-size:12px;color:var(--muted);}
  main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
  #progressWrap{padding:10px 16px;display:none;}
  #progressBar{height:6px;border-radius:4px;background:var(--border);overflow:hidden;}
  #progressFill{height:100%;width:0%;background:var(--accent);transition:width .2s;}
  #progressText{font-size:12px;color:var(--muted);margin-top:6px;}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:80%;padding:10px 14px;border-radius:16px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;}
  .msg.user{align-self:flex-end;background:var(--bubble-user);color:var(--accent-text);border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start;background:var(--bubble-bot);color:var(--text);border-bottom-left-radius:4px;}
  .msg.sys{align-self:center;font-size:12px;color:var(--muted);}
  form{
    display:flex;gap:8px;padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--panel);border-top:1px solid var(--border);
  }
  textarea{
    flex:1;resize:none;border-radius:12px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);padding:10px 12px;font:inherit;max-height:120px;
  }
  button.send{background:var(--accent);color:var(--accent-text);border:none;padding:0 18px;font-weight:600;}
  button.send:disabled{opacity:.5;cursor:not-allowed;}
  .note{font-size:12px;color:var(--muted);text-align:center;padding:6px 16px 0;}
</style>
</head>
<body>
<header>
  <h1>🧠 IA Locale Gratuite</h1>
  <div style="display:flex;gap:8px;align-items:center;">
    <select id="modelSelect">
      <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Llama 3.2 1B (rapide)</option>
      <option value="Llama-3.2-3B-Instruct-q4f32_1-MLC">Llama 3.2 3B (meilleur)</option>
      <option value="gemma-2-2b-it-q4f16_1-MLC">Gemma 2 2B</option>
    </select>
    <button id="loadBtn">Charger le modèle</button>
    <span id="status">Non chargé</span>
  </div>
</header>
<div class="note">100% gratuit — le modèle tourne entièrement dans votre navigateur, aucune donnée n'est envoyée à un serveur.</div>
<div id="progressWrap">
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="progressText"></div>
</div>
<main>
  <div id="chat"></div>
</main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Écris ton message..." disabled></textarea>
  <button type="submit" class="send" id="sendBtn" disabled>Envoyer</button>
</form>

<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm";

const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const form = document.getElementById('form');
const sendBtn = document.getElementById('sendBtn');
const loadBtn = document.getElementById('loadBtn');
const modelSelect = document.getElementById('modelSelect');
const statusEl = document.getElementById('status');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

let engine = null;
let history = [{ role: "system", content: "Tu es un assistant IA utile, concis et amical. Réponds en français sauf si on te parle dans une autre langue." }];

function addMsg(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

loadBtn.addEventListener('click', async () => {
  loadBtn.disabled = true;
  modelSelect.disabled = true;
  progressWrap.style.display = 'block';
  statusEl.textContent = 'Chargement...';
  addMsg('sys', "Téléchargement du modèle en cours (uniquement la première fois, puis mis en cache par le navigateur)...");
  try {
    engine = await webllm.CreateMLCEngine(modelSelect.value, {
      initProgressCallback: (report) => {
        const pct = Math.round((report.progress || 0) * 100);
        progressFill.style.width = pct + '%';
        progressText.textContent = report.text || (pct + '%');
      }
    });
    statusEl.textContent = 'Prêt ✅';
    addMsg('sys', "Modèle chargé. Tu peux discuter !");
    input.disabled = false;
    sendBtn.disabled = false;
    progressWrap.style.display = 'none';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Erreur';
    addMsg('sys', "Échec du chargement : " + (err && err.message ? err.message : String(err)) + ". Ton navigateur supporte peut-être mal WebGPU.");
    loadBtn.disabled = false;
    modelSelect.disabled = false;
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !engine) return;
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  sendBtn.disabled = true;

  const botDiv = addMsg('bot', '...');
  try {
    const stream = await engine.chat.completions.create({
      messages: history,
      stream: true,
      temperature: 0.7,
    });
    let full = '';
    for await (const chunk of stream) {
      const delta = chunk.choices[0]?.delta?.content || '';
      full += delta;
      botDiv.textContent = full || '...';
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    history.push({ role: 'assistant', content: full });
  } catch (err) {
    console.error(err);
    botDiv.textContent = "Erreur pendant la génération : " + (err && err.message ? err.message : String(err));
  }
  sendBtn.disabled = false;
  input.focus();
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
